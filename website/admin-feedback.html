<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>反馈后台 · Memo</title>
  <style>
    :root{--bg:#07090d;--panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.07);--line:rgba(190,214,210,.14);--text:#edf3ef;--muted:#aab6b2;--faint:#74807d;--green:#9bc8a4;--gold:#d6bf84;--danger:#e0a0a0;--sans:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;--serif:'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif;--mono:'JetBrains Mono',ui-monospace,monospace}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07090d,#0b1116 58%,#080b0f);color:var(--text);font-family:var(--sans);line-height:1.7}.wrap{width:min(1180px,calc(100% - 36px));margin:0 auto;padding:28px 0 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}h1{font-family:var(--serif);font-weight:500;margin:0;font-size:32px}.panel{border:1px solid var(--line);border-radius:22px;background:var(--panel);padding:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}input,select,textarea{border:1px solid rgba(190,214,210,.18);border-radius:12px;background:rgba(255,255,255,.045);color:var(--text);font:inherit;padding:10px 12px}select option{background:#0b1116}.btn{border:1px solid var(--line);border-radius:999px;min-height:40px;padding:0 16px;background:rgba(255,255,255,.04);color:var(--text);font:inherit;cursor:pointer}.btn.primary{border:0;background:linear-gradient(135deg,rgba(155,200,164,.92),rgba(134,182,201,.86));color:#06100c}.layout{display:grid;grid-template-columns:420px 1fr;gap:18px}.list{display:grid;gap:10px;max-height:calc(100vh - 210px);overflow:auto}.item{border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.035);padding:13px;cursor:pointer}.item:hover,.item.active{border-color:rgba(155,200,164,.34);background:rgba(155,200,164,.055)}.meta{font-family:var(--mono);font-size:12px;color:var(--faint);display:flex;gap:8px;flex-wrap:wrap}.title{margin:6px 0;color:#fff}.desc{font-size:13px;color:var(--muted);margin:0}.badge{display:inline-flex;padding:2px 8px;border-radius:999px;background:rgba(155,200,164,.1);color:var(--green);font-size:12px}.detail h2{font-family:var(--serif);font-weight:500;margin:0 0 10px}.block{margin:16px 0}.label{color:var(--faint);font-size:12px;margin-bottom:6px}.content{white-space:pre-wrap;color:#dbe8df}.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.imgs img{width:100%;border-radius:14px;border:1px solid var(--line);background:#000}.note{width:100%;min-height:120px}.msg{color:var(--gold);font-size:13px}.empty{color:var(--muted);text-align:center;padding:40px 0}@media(max-width:920px){.layout{grid-template-columns:1fr}.list{max-height:none}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top"><h1>Memo 反馈后台</h1><a class="btn" href="/">返回官网</a></div>
    <div class="panel toolbar"><input id="token" type="password" placeholder="Admin token" style="min-width:260px"><button class="btn primary" id="saveToken">保存 Token</button><select id="statusFilter"><option value="">全部状态</option><option value="new">new</option><option value="processing">processing</option><option value="resolved">resolved</option><option value="closed">closed</option></select><button class="btn" id="refresh">刷新</button><span class="msg" id="msg"></span></div>
    <div class="layout">
      <div class="panel"><div class="list" id="list"><div class="empty">加载反馈列表</div></div></div>
      <div class="panel detail" id="detail"><div class="empty">选择一条反馈查看详情</div></div>
    </div>
  </div>
<script>
const tokenEl=document.getElementById('token'),listEl=document.getElementById('list'),detailEl=document.getElementById('detail'),msg=document.getElementById('msg'),statusFilter=document.getElementById('statusFilter');let currentId='';tokenEl.value=localStorage.getItem('memoFeedbackToken')||'';
function token(){return tokenEl.value.trim()}function say(t){msg.textContent=t;setTimeout(()=>{if(msg.textContent===t)msg.textContent=''},2600)}function h(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function api(path,opt={}){const res=await fetch(path,{...opt,headers:{'Content-Type':'application/json','X-Admin-Token':token(),...(opt.headers||{})}});const data=await res.json().catch(()=>({}));if(!res.ok||!data.ok)throw new Error(data.error||'请求失败');return data}
function typeName(t){return {install:'安装',startup:'启动',agent:'Agent',memory:'记忆',ui:'界面',suggestion:'建议',other:'其他'}[t]||t}
async function load(){listEl.innerHTML='<div class="empty">加载中...</div>';try{const qs=statusFilter.value?`?status=${encodeURIComponent(statusFilter.value)}`:'';const data=await api('/api/feedback'+qs);if(!data.items.length){listEl.innerHTML='<div class="empty">暂无反馈</div>';return}listEl.innerHTML=data.items.map(x=>`<div class="item ${x.id===currentId?'active':''}" data-id="${h(x.id)}"><div class="meta"><span>${h(x.created_at)}</span><span class="badge">${h(x.status)}</span><span>${h(typeName(x.type))}</span></div><div class="title">${h(x.title)}</div><p class="desc">${h(x.description)}</p></div>`).join('');document.querySelectorAll('.item').forEach(el=>el.onclick=()=>detail(el.dataset.id))}catch(e){listEl.innerHTML='<div class="empty">'+h(e.message)+'</div>'}}
async function detail(id){currentId=id;document.querySelectorAll('.item').forEach(x=>x.classList.toggle('active',x.dataset.id===id));detailEl.innerHTML='<div class="empty">加载详情...</div>';try{const {item}=await api('/api/feedback/'+encodeURIComponent(id));detailEl.innerHTML=`<h2>${h(item.title)}</h2><div class="meta"><span>ID ${h(item.id)}</span><span>${h(item.created_at)}</span><span class="badge">${h(item.status)}</span><span>${h(typeName(item.type))}</span></div><div class="block"><div class="label">联系方式</div><div class="content">${h(item.contact||'未填写')}</div></div><div class="block"><div class="label">问题描述</div><div class="content">${h(item.description)}</div></div><div class="block"><div class="label">图片</div><div class="imgs">${(item.images||[]).map(img=>`<a href="data:${h(img.type)};base64,${img.data}" target="_blank"><img src="data:${h(img.type)};base64,${img.data}" alt="${h(img.name)}"></a>`).join('')||'<span class="msg">无图片</span>'}</div></div><div class="block"><div class="label">处理状态</div><select id="detailStatus"><option value="new">new</option><option value="processing">processing</option><option value="resolved">resolved</option><option value="closed">closed</option></select></div><div class="block"><div class="label">内部备注</div><textarea class="note" id="adminNote">${h(item.admin_note||'')}</textarea></div><button class="btn primary" id="saveDetail">保存处理结果</button>`;document.getElementById('detailStatus').value=item.status;document.getElementById('saveDetail').onclick=()=>saveDetail(id)}catch(e){detailEl.innerHTML='<div class="empty">'+h(e.message)+'</div>'}}
async function saveDetail(id){try{await api('/api/feedback/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status:document.getElementById('detailStatus').value,admin_note:document.getElementById('adminNote').value})});say('已保存');load()}catch(e){say(e.message)}}
document.getElementById('saveToken').onclick=()=>{localStorage.setItem('memoFeedbackToken',token());say('Token 已保存');load()};document.getElementById('refresh').onclick=load;statusFilter.onchange=load;load();
</script>
</body>
</html>
