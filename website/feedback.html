<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>问题反馈 · Memo</title>
  <meta name="description" content="向 Memo 提交问题反馈，支持文字描述和图片截图。" />
  <style>
    :root{--bg:#07090d;--panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.065);--line:rgba(190,214,210,.14);--text:#edf3ef;--muted:#aab6b2;--faint:#74807d;--green:#9bc8a4;--gold:#d6bf84;--blue:#86b6c9;--danger:#e0a0a0;--sans:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;--serif:'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif;--mono:'JetBrains Mono',ui-monospace,monospace}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 72% 12%,rgba(155,200,164,.16),transparent 30%),radial-gradient(circle at 12% 18%,rgba(134,182,201,.11),transparent 30%),linear-gradient(180deg,#07090d,#0b1116 58%,#080b0f);color:var(--text);font-family:var(--sans);line-height:1.75}.wrap{width:min(920px,calc(100% - 36px));margin:0 auto;padding:34px 0 64px}a{color:inherit;text-decoration:none}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:42px}.brand{display:flex;align-items:center;gap:12px}.logo{width:34px;height:34px;border:1px solid rgba(155,200,164,.32);border-radius:12px;background:radial-gradient(circle at 35% 30%,rgba(214,191,132,.55),transparent 28%),linear-gradient(145deg,rgba(155,200,164,.22),rgba(134,182,201,.08));display:grid;place-items:center}.logo span{font-family:var(--serif);font-size:18px}.back{color:var(--muted);font-size:14px}.hero{margin-bottom:28px}.eyebrow{display:inline-flex;padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:13px;background:rgba(255,255,255,.035);margin-bottom:16px}h1{font-family:var(--serif);font-weight:500;font-size:clamp(34px,5vw,54px);line-height:1.15;margin:0 0 16px}.lead{color:var(--muted);max-width:680px;margin:0}.card{border:1px solid var(--line);border-radius:26px;background:var(--panel);padding:26px;box-shadow:0 24px 80px rgba(0,0,0,.28)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}label{color:#dbe8df;font-size:14px}input,select,textarea{width:100%;border:1px solid rgba(190,214,210,.18);border-radius:14px;background:rgba(255,255,255,.045);color:var(--text);font:inherit;padding:12px 13px;outline:none}select option{background:#0b1116;color:var(--text)}textarea{min-height:180px;resize:vertical}.hint{color:var(--faint);font-size:12px}.drop{border:1px dashed rgba(155,200,164,.35);border-radius:18px;padding:18px;background:rgba(155,200,164,.035);color:var(--muted);text-align:center;cursor:pointer;transition:.18s}.drop:hover,.drop.drag{background:rgba(155,200,164,.07);border-color:rgba(155,200,164,.55)}.preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:12px}.thumb{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.04)}.thumb img{display:block;width:100%;height:100px;object-fit:cover}.thumb button{position:absolute;right:6px;top:6px;border:0;border-radius:999px;background:rgba(0,0,0,.62);color:#fff;width:26px;height:26px;cursor:pointer}.actions{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:22px}.btn{border:1px solid var(--line);border-radius:999px;min-height:44px;padding:0 18px;background:rgba(255,255,255,.04);color:var(--text);font:inherit;cursor:pointer}.btn.primary{border:0;background:linear-gradient(135deg,rgba(155,200,164,.92),rgba(134,182,201,.86));color:#06100c}.btn:disabled{opacity:.55;cursor:not-allowed}.msg{margin-top:16px;padding:12px 14px;border-radius:14px;display:none}.msg.ok{display:block;background:rgba(155,200,164,.12);border:1px solid rgba(155,200,164,.25);color:#dff1e3}.msg.err{display:block;background:rgba(224,160,160,.12);border:1px solid rgba(224,160,160,.28);color:#ffd9d9}.privacy{margin-top:20px;color:var(--faint);font-size:13px;line-height:1.8}@media(max-width:720px){.grid{grid-template-columns:1fr}.actions{display:block}.btn{width:100%;margin-top:12px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top"><a class="brand" href="/"><span class="logo"><span>M</span></span><span>Memo 麦默</span></a><a class="back" href="/">返回官网</a></div>
    <section class="hero"><div class="eyebrow">Early co-test feedback</div><h1>问题反馈</h1><p class="lead">如果你在安装、启动、连接 Agent 或使用 Memo 时遇到问题，可以在这里提交。支持文字描述和图片截图。</p></section>
    <form class="card" id="form">
      <div class="grid">
        <div class="field"><label for="type">问题类型</label><select id="type" required><option value="install">安装问题</option><option value="startup">启动失败</option><option value="agent">Agent 连接问题</option><option value="memory">记忆 / 检索问题</option><option value="ui">界面问题</option><option value="suggestion">功能建议</option><option value="other">其他</option></select></div>
        <div class="field"><label for="contact">联系方式，可选</label><input id="contact" maxlength="500" placeholder="微信 / 邮箱 / 其他备注" /></div>
      </div>
      <div class="field"><label for="title">问题标题</label><input id="title" maxlength="120" required placeholder="例如：启动后一直停在加载页" /></div>
      <div class="field"><label for="description">问题描述</label><textarea id="description" maxlength="6000" required placeholder="尽量描述：你做了什么、出现了什么现象、期望是什么。"></textarea><div class="hint">最多 6000 字。请不要粘贴 API Key、密码、私人聊天内容或数据库文件。</div></div>
      <div class="field"><label>图片截图</label><div class="drop" id="drop">点击选择图片，或直接粘贴截图 / 拖拽图片到这里<br><span class="hint">最多 3 张，单张 5MB 以内，支持 png / jpg / webp</span></div><input id="file" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden /><div class="preview" id="preview"></div></div>
      <div class="privacy">说明：官网反馈只会提交你主动填写的文字和上传的图片，不会自动读取或上传你的本地 Memo 记忆库、API Key、数据库文件或聊天记录。</div>
      <div class="actions"><span class="hint" id="count">0 / 3 张图片</span><button class="btn primary" id="submit" type="submit">提交反馈</button></div>
      <div id="msg" class="msg"></div>
    </form>
  </div>
<script>
const MAX_IMAGES=3,MAX_SIZE=5*1024*1024;const files=[];const fileInput=document.getElementById('file'),drop=document.getElementById('drop'),preview=document.getElementById('preview'),count=document.getElementById('count'),msg=document.getElementById('msg'),submit=document.getElementById('submit');
function showMsg(text,type){msg.textContent=text;msg.className='msg '+type}
function render(){preview.innerHTML='';files.forEach((f,i)=>{const div=document.createElement('div');div.className='thumb';const img=document.createElement('img');img.src=f.url;const btn=document.createElement('button');btn.type='button';btn.textContent='×';btn.onclick=()=>{URL.revokeObjectURL(f.url);files.splice(i,1);render()};div.append(img,btn);preview.append(div)});count.textContent=`${files.length} / ${MAX_IMAGES} 张图片`}
function addFileList(list){for(const file of list){if(files.length>=MAX_IMAGES){showMsg('最多只能上传 3 张图片。','err');break}if(!['image/png','image/jpeg','image/webp'].includes(file.type)){showMsg('仅支持 png / jpg / webp 图片。','err');continue}if(file.size>MAX_SIZE){showMsg('单张图片不能超过 5MB。','err');continue}files.push({file,url:URL.createObjectURL(file)})}render()}
drop.onclick=()=>fileInput.click();fileInput.onchange=e=>addFileList(e.target.files);drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');addFileList(e.dataTransfer.files)};document.addEventListener('paste',e=>{const imgs=[...e.clipboardData.items].filter(x=>x.kind==='file').map(x=>x.getAsFile()).filter(Boolean);if(imgs.length)addFileList(imgs)});
function fileToData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file)})}
document.getElementById('form').onsubmit=async e=>{e.preventDefault();showMsg('', '');submit.disabled=true;submit.textContent='提交中...';try{const images=[];for(const item of files){images.push({name:item.file.name,type:item.file.type,data:await fileToData(item.file)})}const payload={type:document.getElementById('type').value,title:document.getElementById('title').value.trim(),description:document.getElementById('description').value.trim(),contact:document.getElementById('contact').value.trim(),images};const res=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await res.json().catch(()=>({}));if(!res.ok||!data.ok)throw new Error(data.error||'提交失败');showMsg(`已提交，反馈编号：${data.id}。谢谢你帮 Memo 变好。`,'ok');e.target.reset();files.splice(0);render()}catch(err){showMsg(err.message||'提交失败，请稍后再试。','err')}finally{submit.disabled=false;submit.textContent='提交反馈'}};
</script>
</body>
</html>
